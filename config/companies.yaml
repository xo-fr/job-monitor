# Company registry - India, Java backend / senior software engineer.
#
#   bigtech:      scanned every 2h on odd hours (so they get hourly cover
#                 together with the full sweep)
#   other:        scanned every 2h on even hours (the full sweep)
#   aggregators:  job boards (LinkedIn, Naukri, Indeed) - full sweep
#
# Every entry below was probed live (Oct 2026) and returned postings located
# in India. Counts in the comments are "India postings / in scope for a
# senior Java backend engineer" on the day it was checked - they move daily.
#
# fetcher types: greenhouse | lever | ashby | workday | eightfold |
#                smartrecruiters | amazon | google | microsoft | walmart |
#                phenom | jobspy
#
# ADDING A COMPANY: open its careers page and look at the URL (or the
# browser's network tab) for one of:
#   boards.greenhouse.io/<token>           -> fetcher: greenhouse, token
#   jobs.lever.co/<token>                  -> fetcher: lever, token
#   jobs.ashbyhq.com/<token>               -> fetcher: ashby, token
#   jobs.smartrecruiters.com/<token>       -> fetcher: smartrecruiters, token
#   <tenant>.wdN.myworkdayjobs.com/<site>  -> fetcher: workday, host, tenant, site
# Then dry-run it:  python -m monitor.main --tier all --dry-run
#
# Workday boards are restricted to India automatically: the fetcher finds the
# board's own "India" location facet (`country:` defaults to India). Keyword
# search on Workday is relevance-ranked, so `searches:` runs one pass per term.

x-searches: &search_terms
  - java
  - software engineer
  - backend

