# Company registry — INDIA job market.
# bigtech: scanned every 3 hours. other + aggregators: scanned once daily.
#
# fetcher types: greenhouse | lever | ashby | workday | eightfold |
#                smartrecruiters | amazon | microsoft | instahyre
#
# Every entry below was verified to actually return India-located postings at
# the time it was added (see the india= counts in the comments). Boards that
# are global are pinned to India where the API allows it; anything that slips
# through is dropped later by the location filter in monitor/filters.py.
#
# To find a token: open the company's careers page, check the URL or the
# network tab for boards.greenhouse.io/<token>, jobs.lever.co/<token>,
# jobs.ashbyhq.com/<token>, or <tenant>.wdX.myworkdayjobs.com/<site>.

bigtech:
  - name: Amazon India
    fetcher: amazon                 # pinned with normalized_country_code[]=IND
  - name: Microsoft India
    fetcher: microsoft              # pinned with lc=India
  - name: Nvidia
    fetcher: workday
    host: nvidia.wd5.myworkdayjobs.com
    tenant: nvidia
    site: NVIDIAExternalCareerSite
    search: software engineer India
  - name: Adobe
    fetcher: workday
    host: adobe.wd5.myworkdayjobs.com
    tenant: adobe
    site: external_experienced
    facets: { locationCountry: ["c4f78be1a8f14da0ab49ce1162348a5e"] }  # india=18
  - name: Salesforce
    fetcher: workday
    host: salesforce.wd12.myworkdayjobs.com
    tenant: salesforce
    site: External_Career_Site
    search: software engineer India   # this tenant 400s on the country facet
  - name: Databricks
    fetcher: greenhouse
    token: databricks               # india=82
  - name: Okta
    fetcher: greenhouse
    token: okta                     # india=104
  - name: MongoDB
