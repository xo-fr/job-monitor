aggregators:
  # India-only tech job board with ~13k live postings. This is what covers the
  # companies with no usable public API: Google India, Uber India, Flipkart,
  # Swiggy, Zomato, Ola, and the whole TCS/Infosys/Wipro services sector.
  # job_functions/job_types ids are documented in monitor/fetchers/instahyre.py.
  # Raise max_pages for wider coverage at the cost of more requests
  # (requests = len(job_types) x len(job_functions) x max_pages).
  - name: Instahyre
    fetcher: instahyre
    max_pages: 3
    job_types: [1, 2]               # 1 = full time, 2 = internship
    job_functions: [10, 1, 9, 3, 76]
