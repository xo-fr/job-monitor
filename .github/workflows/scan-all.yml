name: Full sweep India (every 3h)

# The scheduled workhorse: all 60 sources, including every Indian product
# company and the Instahyre aggregator. `--tier all` is a superset of
# `--tier bigtech`, so this is the only workflow that needs a cron.

on:
  schedule:
    # 06:00, 09:00, 12:00, 15:00, 18:00, 21:00, 00:00, 03:00 IST (UTC+5:30)
    - cron: "30 */3 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: "Which sources to scan"
        type: choice
        options: [all, bigtech, other]
        default: all
      dry_run:
        description: "Print results only — save nothing, notify nobody"
        type: boolean
        default: false
      no_notify:
        description: "Save results but send no Discord messages (absorb a backlog quietly)"
        type: boolean
        default: false
      include_senior:
        description: "Also include Senior / Lead titles"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: job-scan          # shared with scan-bigtech so the two never race
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25    # a wedged fetcher must not burn a 6h runner
    env:
      TZ: Asia/Kolkata     # log timestamps in IST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run full sweep
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # On a schedule run `inputs` is empty, so these fall back to defaults.
          TIER: ${{ inputs.tier || 'all' }}
          DRY_RUN: ${{ inputs.dry_run }}
          NO_NOTIFY: ${{ inputs.no_notify }}
          INCLUDE_SENIOR: ${{ inputs.include_senior }}
        run: |
          args="--tier $TIER"
          if [ "$DRY_RUN" = "true" ]; then args="$args --dry-run"; fi
          if [ "$NO_NOTIFY" = "true" ]; then args="$args --no-notify"; fi
          if [ "$INCLUDE_SENIOR" = "true" ]; then args="$args --include-senior"; fi
          echo "running: python -m monitor.main $args"
          python -m monitor.main $args

      - name: Commit and push state
        if: ${{ inputs.dry_run != true }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "job-monitor-bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            git add docs/data/jobs.json
            if git diff --cached --quiet; then
              echo "jobs.json unchanged - nothing to commit"
              exit 0
            fi
            git commit -m "scan(all): update jobs.json"
            if git push origin "HEAD:$BRANCH"; then
              echo "pushed on attempt $attempt"
              exit 0
            fi

            # The dashboard committed a status change while we were scanning.
            # Rebasing would conflict on the JSON, so merge it properly: the
            # remote copy keeps its statuses, our new job ids are added on top.
            echo "push rejected - remote moved; merging remote state and retrying"
            git fetch origin "$BRANCH"
            git show "origin/$BRANCH:docs/data/jobs.json" > /tmp/remote-jobs.json
            python -m monitor.merge_state /tmp/remote-jobs.json docs/data/jobs.json
            cp docs/data/jobs.json /tmp/merged-jobs.json
            git reset --hard "origin/$BRANCH"   # drops our commit; file kept above
            cp /tmp/merged-jobs.json docs/data/jobs.json
          done

          echo "::error::could not push jobs.json after 3 attempts"
          exit 1
